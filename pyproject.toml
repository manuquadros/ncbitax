[project]
name = "ncbitax"
dynamic = ["version"]
description = "Utilities to navigate NCBI taxonomy dump files"
readme = "README.md"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.12, <4"
license = "GPL-3.0-or-later"
dependencies = [
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/taxonomy"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = "src"

[tool.ruff]
line-length = 80

[tool.mypy]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff==0.8.6",
    "mypy>=1.11",
    "types-tqdm>=4.66",
    "git-cliff>=2.13.1",
]

[tool.pdm.scripts]
changelog = "git-cliff --output CHANGELOG.md"
next-version = "git-cliff --bumped-version"
release = "python scripts/release.py"
